<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙与水 · 美术工作台</title>
<link rel="stylesheet" href="css/workbench.css">
<script src="js/app/appearance.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><strong>沙与水</strong><span>美术工作台</span></div>
  <nav class="tabs" aria-label="工作流程">
    <a href="#scenes" data-view="scenes"><b>1</b>场景</a>
    <a href="#assets" data-view="assets"><b>2</b>资产与动画</a>
    <a href="#edit" data-view="edit"><b>3</b>编辑与对比</a>
    <a href="#review" data-view="review"><b>4</b>确认<span class="count" id="review-count" hidden></span></a>
    <a href="#export" data-view="export"><b>5</b>导出</a>
  </nav>
  <div class="top-right">
    <a class="drafts-flag" id="drafts-flag" href="#export" hidden></a>
    <label class="appearance">网页外观
      <select id="appearance">
        <option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option>
      </select>
    </label>
  </div>
</header>

<main>
  <section class="view" id="view-scenes" hidden>
    <aside class="side" aria-label="场景列表"><div id="scene-list"></div></aside>
    <div class="work">
      <div class="stage-host" id="scene-stage"></div>
      <div class="under" id="scene-steps"></div>
    </div>
    <aside class="info" id="scene-info" aria-label="场景说明"></aside>
  </section>

  <section class="view" id="view-assets" hidden>
    <aside class="side" aria-label="筛选">
      <input type="search" id="asset-search" placeholder="搜索名称或标识" aria-label="搜索资产">
      <div class="filter-group" id="asset-categories" role="group" aria-label="分类"></div>
      <div class="filter-group" id="asset-status" role="group" aria-label="状态"></div>
    </aside>
    <div class="work">
      <p class="result-count" id="asset-count"></p>
      <div class="cards" id="asset-cards"></div>
    </div>
    <aside class="info inspector" id="asset-inspector" aria-label="资产详情"></aside>
  </section>

  <section class="view" id="view-edit" hidden>
    <div class="edit-layout" id="edit-root"></div>
  </section>

  <section class="view single" id="view-review" hidden>
    <div class="page" id="review-root"></div>
  </section>

  <section class="view single" id="view-export" hidden>
    <div class="page" id="export-root"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="data/bundle.js"></script>
<script src="js/core/raster.js"></script>
<script src="js/core/font-data.js"></script>
<script src="js/core/sprites.js"></script>
<script src="js/core/tilemodel.js"></script>
<script src="js/core/terrain.js"></script>
<script src="js/core/ambient.js"></script>
<script src="js/core/scene.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/app/store.js"></script>
<script src="js/app/stage.js"></script>
<script src="js/app/views/scenes.js"></script>
<script src="js/app/views/assets.js"></script>
<script src="js/app/views/editor.js"></script>
<script src="js/app/views/review.js"></script>
<script src="js/app/views/export.js"></script>
<script src="js/app/main.js"></script>
</body>
</html>
