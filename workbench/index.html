<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渡界人 PORTITOR · 工作台</title>
<link rel="stylesheet" href="css/workbench.css">
<link rel="stylesheet" href="audio.css">
<script src="js/app/appearance.js"></script>
<script src="js/app/nav.js"></script>
</head>
<body>
<header class="topbar">
  <button class="nav-toggle" id="nav-toggle" type="button" aria-controls="nav" aria-expanded="true" aria-label="菜单"><span class="bars" aria-hidden="true"></span></button>
  <div class="brand"><strong>渡界人</strong><span>PORTITOR · 内容与美术工作台</span></div>
  <div class="crumb" id="nav-crumb"></div>
  <div class="top-right">
    <a class="drafts-flag" id="drafts-flag" href="#export" hidden></a>
    <label class="appearance"><span class="appearance-label">网页外观</span>
      <select id="appearance">
        <option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option>
      </select>
    </label>
  </div>
</header>
<nav class="nav" id="nav" aria-label="工作台页面"></nav>
<div class="nav-scrim" id="nav-scrim" hidden></div>

<main>
  <section class="view single" id="view-overview" hidden>
    <div class="page" id="overview-root"></div>
  </section>

  <section class="view" id="view-modes" hidden>
    <aside class="side" id="modes-side" aria-label="模式与组"></aside>
    <div class="work" id="modes-work"></div>
    <aside class="info" id="modes-info" aria-label="详情"></aside>
  </section>

  <section class="view" id="view-mechanisms" hidden>
    <aside class="side" id="mech-side" aria-label="机制列表"></aside>
    <div class="work" id="mech-work"></div>
    <aside class="info" id="mech-info" aria-label="说明"></aside>
  </section>


  <section class="view" id="view-rooms2" hidden>
    <aside class="side" id="rooms2-side" aria-label="开局池与房间"></aside>
    <div class="work" id="rooms2-work"></div>
    <aside class="info" id="rooms2-info" aria-label="房间详情"></aside>
  </section>

  <section class="view catalog-view" id="view-ids" hidden>
    <aside class="side" id="ids-side" aria-label="编号空间"></aside>
    <div class="work" id="ids-work"></div>
  </section>
  <section class="view catalog-view" id="view-catalog" hidden>
    <aside class="side" id="catalog-side" aria-label="目录"></aside>
    <div class="work" id="catalog-work"></div>
  </section>

  <section class="view" id="view-scenes" hidden>
    <aside class="side" aria-label="场景列表"><div id="scene-list"></div></aside>
    <div class="work">
      <div class="stage-host" id="scene-stage"></div>
      <div class="under" id="scene-steps"></div>
    </div>
    <aside class="info" id="scene-info" aria-label="场景说明"></aside>
  </section>

  <section class="view" id="view-assets" hidden>
    <aside class="side" aria-label="筛选">
      <input type="search" id="asset-search" placeholder="搜索名称或标识" aria-label="搜索资产">
      <div class="filter-group" id="asset-categories" role="group" aria-label="分类"></div>
      <div class="filter-group" id="asset-status" role="group" aria-label="状态"></div>
    </aside>
    <div class="work">
      <p class="result-count" id="asset-count"></p>
      <div class="cards" id="asset-cards"></div>
    </div>
    <aside class="info inspector" id="asset-inspector" aria-label="资产详情"></aside>
  </section>

  <section class="view" id="view-edit" hidden>
    <div class="edit-layout" id="edit-root"></div>
  </section>

  <section class="view single" id="view-review" hidden>
    <div class="page" id="review-root"></div>
  </section>

  <section class="view single" id="view-export" hidden>
    <div class="page" id="export-root"></div>
  </section>
  <section class="view single" id="view-audio" hidden>
    <div class="page audio-page" id="audio-root"></div>
  </section>

  <section class="view single" id="view-ui-proposals" hidden>
    <div class="page" id="ui-proposals-root"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

</body>
