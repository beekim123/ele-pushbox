[preset.0]
name="macOS Development"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="portitor_stage1_candidate"
export_filter="all_resources"
include_filter="*.json,*.woff2,*.dylib,*.txt"
exclude_filter="tests/*,reports/*,tools/*"
export_path="../builds/PORTITOR-Stage1-Candidate.app"
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
; The bundled 4.7.2 template is universal; package-macos.sh thins the result to arm64.
binary_format/architecture="universal"
application/bundle_identifier="org.portitor.stage1.candidate"
application/app_category="Games"
application/short_version="0.1.0"
application/version="0.1.0"
application/min_macos_version="15.6"
codesign/codesign=0
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
